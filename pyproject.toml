[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vibe-coding"
version = "0.1.0"
description = "Twitch Vibe Coding - система параллельных задач с approval-воркфлоу для стримов"
authors = ["VibeCoder"]

[tool.poetry.dependencies]
python = "^3.11"
aiosqlite = "^0.19.0"
pyyaml = "^6.0"
typer = "^0.9.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.6.0"
black = "^23.10.0"
ruff = "^0.1.0"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]